<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Fast Tree Tabs options</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      font-size: 14px;
      color: #ddd;
      background: #232327;
      max-width: 34em;
      margin: 2em auto;
      padding: 0 1em;
    }
    h1 { font-size: 1.3em; font-weight: 600; }
    section { margin: 1.5em 0; }
    label { display: block; margin: 0.6em 0; }
    select, input[type=number] {
      background: #38383d;
      color: #ddd;
      border: 1px solid #555;
      border-radius: 4px;
      padding: 3px 6px;
      font: inherit;
    }
    .hint { color: #888; font-size: 0.85em; margin: 0.2em 0 0; }
  </style>
</head>
<body>
  <h1>Fast Tree Tabs</h1>

  <section>
    <label>
      New tab with no opener (Ctrl+T, external link):
      <select id="newTabNoOpener">
        <option value="child-of-active">Child of the active tab</option>
        <option value="after-active">Root, after the active tab's subtree</option>
        <option value="end">Root, at the end</option>
        <option value="native">Wherever Firefox puts it</option>
      </select>
    </label>
    <label>
      New child tabs land:
      <select id="insertChildAt">
        <option value="first">First in the parent's subtree</option>
        <option value="last">After the parent's existing children</option>
      </select>
    </label>
  </section>

  <section>
    <label>
      <input type="checkbox" id="closeCollapsedClosesSubtree">
      Closing a collapsed tab also closes its descendants
    </label>
    <p class="hint">With this on, closing an expanded tab closes only it —
      its children are promoted. An explicit "close tree" is always
      available in the right-click menu.</p>
    <label>
      <input type="checkbox" id="animations">
      Animate tree changes
    </label>
    <label>
      Indent per level: <input type="number" id="indentSize" min="4" max="40" step="1"> px
    </label>
  </section>

  <script src="options.js"></script>
</body>
</html>
